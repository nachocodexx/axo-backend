services:
  axo-backend:
    # Assumes a Dockerfile is present in the current directory.
    # Docker Compose will build this image automatically.
    build: .
    container_name: axo-backend
    # Use an .env file to manage environment variables for flexibility.
    env_file:
      - .env.dev
    ports:
      # Maps the host port (from .env, defaults to 17000) to the container port.
      - "${AXO_BACKEND_API_PORT:-17000}:${AXO_BACKEND_API_PORT:-17000}"
    volumes:
      # Mounts the local 'axobackend' directory into the container at '/app/axobackend'.
      # This is crucial for the --reload flag to detect code changes and auto-restart.
      # Make sure your Dockerfile sets the WORKDIR to /app.
      - ./axobackend:/app/axobackend
    # The command to start the Uvicorn server, using environment variables for configuration.
    command: >
      uvicorn axobackend.main:app
      --host ${AXO_BACKEND_API_HOST:-0.0.0.0}
      --port ${AXO_BACKEND_API_PORT:-17000}
      --log-level debug
    networks:
      - axo-net

  axo-db:
    image: mongo:latest
    container_name: axo-db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - axo-db-data:/data/db
    restart: unless-stopped
    networks:
      - axo-net

networks:
  axo-net:
    external: true
volumes:
  axo-db-data:
    driver: local
